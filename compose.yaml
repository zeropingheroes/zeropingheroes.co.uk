services:
  wordpress:
    build: .
    container_name: wordpress
    user: "${UID}:${GID}"
    volumes:
      - ./php.ini:/usr/local/etc/php/conf.d/conf.ini
      - ./www:/var/www/html
      - ./msmtprc:/etc/msmtprc
    ports:
      - 80:80
    env_file: .env
    depends_on:
      - mysql
    restart: unless-stopped
  mysql:
    image: mysql:8.0
    container_name: mysql
    volumes:
      - mysql:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    env_file: .env
    restart: unless-stopped
volumes:
    mysql:
